<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-card-1 {
        animation: float1 6s ease-in-out infinite alternate;
      }
      .float-card-2 {
        animation: float2 7s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8 6;
        animation: flowDash 20s linear infinite;
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes float1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(10px); }
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.35; }
        100% { transform: scale(1.18); opacity: 0.65; }
      }
    </style>
  </defs>

  <!-- Deep Tech Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic / Animated Ambient Background Orbs -->
  <g class="pulse-circle" style="transform-origin: 1050px 70px;">
    <circle cx="1050" cy="70" r="140" fill="url(#glowGrad)" filter="blur(40px)" />
  </g>
  <g class="pulse-circle" style="transform-origin: 150px 300px; animation-delay: -2s;">
    <circle cx="150" cy="300" r="120" fill="#38bdf8" fill-opacity="0.18" filter="blur(40px)" />
  </g>

  <!-- Dynamic Connecting Flow Lines (Background Layer) -->
  <g stroke="#6366f1" stroke-width="2" fill="none" opacity="0.35" class="dash-flow">
    <path d="M 80 180 Q 300 280 600 180 T 1120 180" />
    <path d="M 100 80 C 400 30 700 240 1100 290" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 50 300 C 350 350 850 50 1150 100" stroke="#c084fc" stroke-width="1.5" />
  </g>

  <!-- Subtle Floating Decorative Node Pills (Dynamic Aspects in Background) -->
  <g class="float-card-1" opacity="0.75">
    <rect x="940" y="45" width="210" height="46" rx="23" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="965" cy="68" r="7" fill="#10b981" />
    <text x="982" y="73" class="tag-text">LLM Agents &amp; RAG</text>
  </g>

  <g class="float-card-2" opacity="0.75">
    <rect x="910" y="260" width="240" height="46" rx="23" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="935" cy="283" r="7" fill="#06b6d4" />
    <text x="952" y="288" class="tag-text">Omnichannel Messaging</text>
  </g>

  <!-- High-Contrast Foreground Content (Title, Subtitle, Badges) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="320" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8" />
      <text x="30" y="21" class="tag-text" fill="#a5b4fc" font-size="12">CURATED REPOSITORY &amp; ECOSYSTEM</text>
    </g>

    <!-- Main Heading (Always in foreground, never obscured) -->
    <text x="0" y="142" class="title-text" fill="url(#primaryGrad)">
      Awesome No-Code Conversational Bot Builder
    </text>

    <!-- Clear Informative Subtitle -->
    <text x="0" y="184" class="subtitle-text">
      The definitive directory of visual bot designers, drag-and-drop conversational AI,
    </text>
    <text x="0" y="212" class="subtitle-text">
      and open-source ManyChat, Voiceflow &amp; enterprise agent alternatives.
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 252)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="150" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="75" y="23" class="tag-text" text-anchor="middle" fill="#93c5fd">💬 Visual Bots</text>

      <!-- Tag 2 -->
      <rect x="162" y="0" width="140" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="232" y="23" class="tag-text" text-anchor="middle" fill="#c4b5fd">🤖 AI Agents</text>

      <!-- Tag 3 -->
      <rect x="314" y="0" width="150" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="389" y="23" class="tag-text" text-anchor="middle" fill="#6ee7b7">⚡ Open Source</text>

      <!-- Tag 4 -->
      <rect x="476" y="0" width="160" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="556" y="23" class="tag-text" text-anchor="middle" fill="#fbcfe8">🌐 Omnichannel</text>
    </g>
  </g>
</svg>
